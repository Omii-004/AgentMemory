version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agentmemory_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentmemory_secret}
      POSTGRES_DB: ${POSTGRES_DB:-agentmemory}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omii} -d ${POSTGRES_DB:-agentmemory}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local